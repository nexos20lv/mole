name: Build & Verify

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Application Bundle
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh

      - name: Verify Bundle
        run: |
          ls -la build/Mole.app
          test -f build/Mole.app/Contents/MacOS/Mole
